[package]
name = "quantitative-data-analysis-rs"
version = "0.32.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.10.1"
bytestring = "1.5.0"
anyhow = "1.0.100"
thiserror = "2.0.17"
simple_moving_average = "1.0.2"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
itertools = "0.14.0"
charts-rs = "0.3.25"
num-traits = "0.2.19"
strum = { version = "0.27.2", features = ["derive"] }
yahoo_finance_api = "4.1.0"
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"
tryhard = "0.5.2"
reqwest = { version = "0.12.24", features = ["json"] }
query-string-builder = "0.6.0"
rayon = "1.11.0"
deref-derive = "0.1.0"
dirs = "6.0.0"

[dev-dependencies]
indoc = "2.0.7"
rstest = "0.26.1"
tokio-test = "0.4.4"
pretty_assertions = "1.4.1"

[build]
rustflags = ["-C", "codegen-units=16"]
incremental = true
rustc-wrappers = ["sccache"]
