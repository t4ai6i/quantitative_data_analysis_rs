[package]
name = "quantitative-data-analysis-rs"
version = "0.30.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
thiserror = "2.0.12"
simple_moving_average = "1.0.2"
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.3"
itertools = "0.14.0"
charts-rs = "0.3.24"
num-traits = "0.2.19"
strum = { version = "0.27.1", features = ["derive"] }
yahoo_finance_api = "2.4.0"
tokio = { version = "1.45.1", features = ["full"] }
async-trait = "0.1.88"
tryhard = "0.5.2"
reqwest = { version = "0.12.20", features = ["json"] }
query-string-builder = "0.6.0"
rayon = "1.10.0"
deref-derive = "0.1.0"

[dev-dependencies]
indoc = "2.0.6"
rstest = "0.25.0"
tokio-test = "0.4.4"